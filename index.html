<style>

<body><main id="app">
  <section id="home" class="view home active"><div class="home-inner"><aside class="brand"><div><p class="eyebrow">ORIGINAL HERO BATTLE</p><h1>光能英雄<span>暗影怪兽</span></h1><p>选择你的光能英雄，在 90 秒内击败入侵城市的暗影怪兽。每位英雄拥有独立的招式组合和一次终极技。</p></div><div class="rule">横屏战斗 · 20 个关卡<br>移动、三个技能、终极技<br>击飞与眩晕对抗</div><button class="share" id="shareHome">⌁ 分享给好友试玩</button></aside><section class="select-panel"><div class="section-head"><h2>选择英雄</h2><small>5 名可选 · 原创设定</small></div><div id="heroGrid" class="hero-grid"></div><button id="startBtn" class="start" disabled>选择英雄后开始战斗</button></section></div></section>
  <section id="battle" class="view battle"><header class="hud"><div><div class="fighter-name"><b id="heroName">光能英雄</b><span id="heroHpText">100 / 100</span></div><div class="hp"><i id="heroHp"></i></div></div><div class="round"><small id="roundScene">都市防卫区</small><strong id="roundText">第 1 / 20 关</strong><small id="timer">90</small></div><div class="enemy"><div class="fighter-name"><span id="monsterHpText">100 / 100</span><b id="monsterName">暗影怪兽</b></div><div class="hp"><i id="monsterHp"></i></div></div></header><div id="arena" class="arena"><div class="scene"><i class="planet"></i><i class="city"></i><i class="city"></i><i class="city"></i><i class="city"></i></div><i class="ground"></i><div id="heroUnit" class="unit hero"><i class="portrait"></i></div><div id="monsterUnit" class="unit monster"><i class="portrait"></i></div><i id="beam" class="beam"></i><i id="impact" class="impact"></i><div id="notice" class="notice"></div></div><footer class="controls"><div class="move"><button data-move="-1" aria-label="向左移动">◀</button><button data-move="1" aria-label="向右移动">▶</button></div><div id="skills" class="skills"></div></footer></section>
  <section id="result" class="view result"><div class="result-card"><p class="eyebrow" id="resultKicker">战斗结算</p><h2 id="resultTitle">胜利</h2><p id="resultDetail">城市防卫成功</p><div class="stats"><div><b id="statDamage">0</b><span>总输出</span></div><div><b id="statHp">0%</b><span>剩余生命</span></div><div><b id="statTime">0s</b><span>剩余时间</span></div></div><div class="result-actions"><button class="home-btn" id="homeBtn">返回首页</button><button id="retryBtn">重新挑战</button><button class="next" id="nextBtn">下一关</button></div></div></section>
</main><script>
const heroes=[
 {name:'德尔塔斥候',type:'高速突击',img:'assets/heroes/Codex 图像 2026年8月11日 11_27_52.png',skills:[['X 光束',14,4],['飞踢',20,7],['连环拳',11,3]],ult:['星核爆发',48]},

 {name:'轨道突击者',type:'极速战士',img:'assets/heroes/Codex 图像 2026年8月11日 11_27_46.png',skills:[['回旋光刃',15,4],['流星踢',23,7],['闪电连击',12,3]],ult:['轨道超新星',52]},
 {name:'以太贤者',type:'光能掌控',img:'assets/heroes/Codex 图像 2026年8月11日 11_27_42.png',skills:[['圣光束',17,4],['神圣踢',20,6],['能量震击',14,3]],ult:['以太裁决',55]},
 {name:'索尔彗星',type:'欢乐重拳',img:'assets/heroes/Codex 图像 2026年8月11日 11_27_25.png',skills:[['太阳光线',15,4],['彗星踢',22,7],['彩虹拳',13,3]],ult:['烈日终结',50]}
];
const monsters=['玄岩角兽','翠刃螳螂异客','赤钳海岸兽','深渊触手兽','铁甲独角虫','黑曜猿兽','雷翼迅禽','孢子寄生兽','机械蝉兽','迷雾狼兽','彩羽蜗兽','掘地鼹兽','毒沼蛙王','珊瑚龟巨兽','霜刃螳螂','黄铜角机兽','酸液幼虫王','雷鸣海鸥兽','藤蔓石像兽','太阳独眼兽'];

const monsterImage=n=>`assets/characters/${String(n+1).padStart(2,'0')}_${['basalt_horn_beast','mantis_alien','crimson_pincer_kaiju','abyss_tentacle_beast','iron_beetle_colossus','obsidian_ape_kaiju','stormwing_raptor','spore_parasite_giant','clockwork_cicada','fog_wolf_brute','plume_snail_giant','tunnel_mole_kaiju','venom_frog_titan','coral_turtle_colossus','frost_mantis_knight','brass_horn_automaton','acid_larva_titan','thunder_gull_beast','vine_golem_kaiju','solar_cyclops_kaiju'][n]}.png`;
let selected=null,round=0,state=null,loopId=null;
const $=s=>document.querySelector(s); const show=id=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$('#'+id).classList.add('active')};
function renderHeroes(){const grid=$('#heroGrid');heroes.forEach((h,i)=>{const b=document.createElement('button');b.className='hero-card';b.innerHTML=`<img src="${h.img}" alt="${h.name}"><b>${h.name}</b><span>${h.type}</span>`;b.onclick=()=>{selected=i;document.querySelectorAll('.hero-card').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('#startBtn').disabled=false;$('#startBtn').textContent=`使用${h.name}开始战斗`};grid.append(b)})}
function audio(freq=300,d=.08){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;g.gain.setValueAtTime(.04,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch{}}
function battleStart(next=false){if(!next)round=0;clearInterval(loopId);const hero=heroes[selected];const hp=125+round*2,ehp=112+round*17;state={hero,hp,maxHp:hp,enemy:ehp,maxEnemy:ehp,time:90,damage:0,heroX:13,enemyX:72,stun:0,enemyCd:2.2,cools:[0,0,0],ult:false,ended:false};$('#heroName').textContent=hero.name;$('#monsterName').textContent=monsters[round];$('#roundText').textContent=`第 ${round+1} / 20 关`;$('#roundScene').textContent=scenes[round%scenes.length];$('#heroUnit .portrait').style.backgroundImage=`url("${hero.img.replace('assets/heroes/','assets/characters/')}")`;$('#monsterUnit .portrait').style.backgroundImage=`url("${monsterImage(round)}")`;$('#monsterUnit .portrait').style.backgroundSize='300% 100%';$('#monsterUnit .portrait').style.backgroundPosition='left center';$('#arena').style.filter=`hue-rotate(${round*13}deg)`;renderSkills();update();show('battle');notice(`第 ${round+1} 关 · ${monsters[round]}`);loopId=setInterval(tick,100)}
function renderSkills(){const box=$('#skills');box.innerHTML='';state.hero.skills.forEach((s,i)=>{const b=document.createElement('button');b.className='skill ready';b.dataset.index=i;b.innerHTML=`<b>${s[0]}</b><small>伤害 ${s[1]} · 冷却 ${s[2]} 秒</small><i class="cool" hidden></i>`;b.onclick=()=>attack(i);box.append(b)});const u=document.createElement('button');u.className='skill ultimate ready';u.dataset.index='3';u.innerHTML=`<b>${state.hero.ult[0]}</b><small>终极技 · 每局一次</small><i class="cool" hidden></i>`;u.onclick=()=>attack(3);box.append(u)}
function tick(){if(state.ended)return;state.time-=.1;if(state.time<=0)return finish(false,'时间耗尽，怪兽仍在城市中肆虐');if(state.stun>0)state.stun-=.1;else{state.enemyX+=Math.sin(Date.now()/400+round)*.13;state.enemyX=Math.max(47,Math.min(79,state.enemyX));state.enemyCd-=.1;if(state.enemyCd<=0){enemyAttack();state.enemyCd=1.9+Math.random()*1.3}}state.cools=state.cools.map(v=>Math.max(0,v-.1));update()}
function update(){const s=state;$('#heroHp').style.width=`${s.hp/s.maxHp*100}%`;$('#monsterHp').style.width=`${s.enemy/s.maxEnemy*100}%`;$('#heroHpText').textContent=`${Math.max(0,Math.ceil(s.hp))} / ${s.maxHp}`;$('#monsterHpText').textContent=`${Math.max(0,Math.ceil(s.enemy))} / ${s.maxEnemy}`;$('#timer').textContent=Math.max(0,Math.ceil(s.time));$('#heroUnit').style.left=`${s.heroX}%`;$('#monsterUnit').style.left=`${s.enemyX}%`;$('#heroUnit').classList.toggle('stunned',s.stun>0);document.querySelectorAll('.skill').forEach((b,i)=>{const v=i===3?(s.ult?999:0):s.cools[i];const cool=b.querySelector('.cool');cool.hidden=v<=0;cool.textContent=i===3&&s.ult?'已使用':v.toFixed(1);b.classList.toggle('ready',v<=0)})}
function move(dir){if(!state||state.ended||state.stun>0)return;state.heroX=Math.max(2,Math.min(55,state.heroX+dir*4));$('#heroUnit').classList.add('cast');setTimeout(()=>$('#heroUnit').classList.remove('cast'),220);update()}
function attack(i){const s=state;if(!s||s.ended||s.stun>0)return;if(i===3&&s.ult){notice('终极技已使用');return}if(i<3&&s.cools[i]>0)return;const [name,base,cd]=i===3?[s.hero.ult[0],s.hero.ult[1],0]:s.hero.skills[i];const distance=Math.abs(s.enemyX-s.heroX);let damage=base*(distance>38?.72:1);if(i===1)damage+=5;if(i===3){s.ult=true;damage+=round*2.2}s.damage+=Math.round(damage);s.enemy-=damage;if(i<3)s.cools[i]=cd;$('#heroUnit').classList.add('cast');$('#monsterUnit').classList.add('hit');beam(i);audio(i===3?120:390);notice(`${name} -${Math.round(damage)}`);setTimeout(()=>{$('#heroUnit').classList.remove('cast');$('#monsterUnit').classList.remove('hit')},420);if(s.enemy<=0)finish(true,`${monsters[round]} 已被击败！`);update()}
function beam(i){const a=$('#arena').getBoundingClientRect(),h=$('#heroUnit').getBoundingClientRect(),m=$('#monsterUnit').getBoundingClientRect(),b=$('#beam'),p=$('#impact');const x=h.left-a.left+h.width*.72,y=h.top-a.top+h.height*.34,dx=m.left-h.left; b.style.left=x+'px';b.style.top=y+'px';b.style.width=Math.max(45,dx)+'px';b.style.transform=`rotate(${i===1?-8:0}deg)`;b.style.opacity=1;p.style.left=(m.left-a.left+m.width*.48)+'px';p.style.top=(m.top-a.top+m.height*.42)+'px';p.classList.remove('active');void p.offsetWidth;p.classList.add('active');setTimeout(()=>b.style.opacity=0,240)}
function enemyAttack(){const s=state;let dmg=7+round*1.5;if(Math.abs(s.enemyX-s.heroX)>30)dmg*=.55;s.hp-=dmg;s.heroX=Math.max(2,s.heroX-4);s.stun=Math.random()<.3?1.2:0;$('#heroUnit').classList.add('hit');audio(150,.12);notice(s.stun?'怪兽震击 · 眩晕！':`怪兽重击 -${Math.round(dmg)}`);setTimeout(()=>$('#heroUnit').classList.remove('hit'),420);if(s.hp<=0)finish(false,'英雄能量耗尽，城市失守');update()}
function notice(t){const n=$('#notice');n.textContent=t;n.classList.remove('show');void n.offsetWidth;n.classList.add('show')}
function finish(win,detail){if(state.ended)return;state.ended=true;clearInterval(loopId);$('#resultKicker').textContent=win?'城市防卫成功':'战斗失败';$('#resultTitle').textContent=win?'胜利！':'能量耗尽';$('#resultDetail').textContent=detail;$('#statDamage').textContent=state.damage;$('#statHp').textContent=`${Math.max(0,Math.round(state.hp/state.maxHp*100))}%`;$('#statTime').textContent=`${Math.max(0,Math.ceil(state.time))}s`;$('#nextBtn').style.display=win&&round<19?'block':'none';show('result')}
$('#startBtn').onclick=()=>battleStart();$('#retryBtn').onclick=()=>battleStart(true);$('#nextBtn').onclick=()=>{round++;battleStart(true)};$('#homeBtn').onclick=()=>show('home');document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(Number(b.dataset.move)));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1);if(['1','2','3','4'].includes(e.key))attack(Number(e.key)-1)});async function share(){const text='变身光能英雄，一起击败暗影怪兽吧！';try{if(navigator.share)await navigator.share({title:'光能英雄：暗影怪兽',text,url:location.href});else{await navigator.clipboard.writeText(location.href);notice('链接已复制，发给好友试玩吧')}}catch{}} $('#shareHome').onclick=share;renderHeroes();

// Replace the prototype button combat with a high-frequency side-scrolling combo loop.
let combatLastInput=0, combatCombo=0, combatFrozen=0, combatJump=0, combatJumpVelocity=0;
function combatBattleStart(next=false){if(!next)round=0;clearInterval(loopId);const hero=heroes[selected];const baseHp=160+round*3,monsterHp=150+round*20;state={hero,hp:baseHp,maxHp:baseHp,enemy:monsterHp,maxEnemy:monsterHp,time:90,damage:0,heroX:12,enemyX:70,stun:0,enemyCd:1.5,cools:[0,0,0],ult:false,ended:false,combo:0,enemyStun:0};combatCombo=0;combatLastInput=0;combatFrozen=0;combatJump=0;combatJumpVelocity=0;$('#heroName').textContent=hero.name;$('#monsterName').textContent=monsters[round];$('#roundText').textContent=`第 ${round+1} / 20 关`;$('#roundScene').textContent=scenes[round%scenes.length];$('#heroUnit').className='unit hero action-unit';$('#monsterUnit').className='unit monster action-unit';$('#heroUnit .portrait').style.backgroundImage="url('assets/combat/hero-fighting.png')";$('#monsterUnit .portrait').style.backgroundImage="url('assets/combat/monster-attacking.png')";$('#arena').className='arena action-arena';if(!$('#comboBox')){$('#arena').insertAdjacentHTML('beforeend','<div id="comboBox" class="combo"><b>0 COMBO</b><small>连击正在累积</small></div><i id="combatFlash" class="combat-flash"></i>')}combatRenderSkills();combatUpdate();show('battle');notice('快速连招模式 · 靠近怪兽后攻击');loopId=setInterval(combatTick,50)}
function combatRenderSkills(){const box=$('#skills');box.innerHTML='';const button=(label,key,desc,kind,classes='')=>{const b=document.createElement('button');b.className=`skill ${classes} ready`;b.innerHTML=`<b>${label}</b><small>${key} · ${desc}</small><i class="cool" hidden></i>`;b.onclick=()=>combatAttack(kind);box.append(b)};button('普通攻击','J','三连段 / 可连点','basic','basic');button('上挑破击','K','击退 · 冷却 3 秒','launch','emphasis');button('光束追击','L','远程命中 · 冷却 5 秒','beam','');button(state.hero.ult[0],'U','终结技 · 每局一次','ultimate','ultimate');$('.move').innerHTML='<button data-action="left" aria-label="向左移动">◀</button><button data-action="jump" aria-label="跳跃">▲</button><button data-action="right" aria-label="向右移动">▶</button>';document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='jump')combatJumpStart();else combatMove(a==='left'?-1:1)})}
function combatTick(){if(!state||state.ended)return;if(combatFrozen>0){combatFrozen-=.05;return}state.time-=.05;if(state.time<=0)return combatFinish(false,'时间耗尽，暗影怪兽仍在城市中肆虐');if(combatJump>0||combatJumpVelocity!==0){combatJumpVelocity-=.85;combatJump+=combatJumpVelocity;if(combatJump<=0){combatJump=0;combatJumpVelocity=0}}if(state.stun>0)state.stun-=.05;state.cools=state.cools.map(v=>Math.max(0,v-.05));state.enemyStun=Math.max(0,state.enemyStun-.05);const dx=state.heroX-state.enemyX;if(state.enemyStun<=0){if(Math.abs(dx)>19){state.enemyX+=Math.sign(dx)*.45;$('#monsterUnit').classList.add('run')}else{$('#monsterUnit').classList.remove('run');state.enemyCd-=.05;if(state.enemyCd<=0){combatEnemyAttack();state.enemyCd=1.2+Math.random()*1.1}}}else $('#monsterUnit').classList.remove('run');if(Date.now()-combatLastInput>850)combatCombo=0;combatUpdate()}
function combatUpdate(){const s=state;$('#heroHp').style.width=`${Math.max(0,s.hp/s.maxHp*100)}%`;$('#monsterHp').style.width=`${Math.max(0,s.enemy/s.maxEnemy*100)}%`;$('#heroHpText').textContent=`${Math.max(0,Math.ceil(s.hp))} / ${s.maxHp}`;$('#monsterHpText').textContent=`${Math.max(0,Math.ceil(s.enemy))} / ${s.maxEnemy}`;$('#timer').textContent=Math.max(0,Math.ceil(s.time));$('#heroUnit').style.left=`${s.heroX}%`;$('#monsterUnit').style.left=`${s.enemyX}%`;$('#heroUnit').style.bottom=`calc(10% + ${combatJump}px)`;const box=$('#comboBox');box.querySelector('b').textContent=`${combatCombo} COMBO`;box.classList.toggle('show',combatCombo>0);document.querySelectorAll('.skill').forEach((b,i)=>{const kind=['basic','launch','beam','ultimate'][i],v=kind==='launch'?s.cools[0]:kind==='beam'?s.cools[1]:kind==='ultimate'?(s.ult?999:0):0,cool=b.querySelector('.cool');cool.hidden=v<=0;cool.textContent=kind==='ultimate'&&s.ult?'已使用':v.toFixed(1);b.classList.toggle('ready',v<=0)})}
function combatMove(dir){if(!state||state.ended||state.stun>0)return;state.heroX=Math.max(1,Math.min(72,state.heroX+dir*4.8));$('#heroUnit').classList.add('run');setTimeout(()=>$('#heroUnit').classList.remove('run'),180);combatUpdate()}
function combatJumpStart(){if(!state||state.ended||combatJump>0)return;combatJumpVelocity=12;audio(510,.08);notice('跳跃闪避')}
function combatInRange(range){return Math.abs(state.heroX-state.enemyX)<range}
function combatAttack(kind){const s=state;if(!s||s.ended||s.stun>0)return;let damage=0,range=27,action='punch',text='';if(kind==='basic'){if(Date.now()-combatLastInput>600)combatCombo=0;combatCombo=Math.min(3,combatCombo+1);combatLastInput=Date.now();damage=8+combatCombo*5;action=combatCombo===3?'kick':'punch';text=`${combatCombo} 连击`;state.heroX=Math.min(78,state.heroX+2.5)}if(kind==='launch'){if(s.cools[0]>0)return;s.cools[0]=3;damage=25;range=30;action='launch';text='上挑破击'}if(kind==='beam'){if(s.cools[1]>0)return;s.cools[1]=5;damage=20;range=64;action='launch';text='光束追击'}if(kind==='ultimate'){if(s.ult)return;s.ult=true;damage=58+round*2;range=70;action='launch';text=state.hero.ult[0]}$('#heroUnit').classList.remove('punch','kick','launch');void $('#heroUnit').offsetWidth;$('#heroUnit').classList.add(action);if(combatInRange(range)){combatHit(damage,kind,text)}else{notice(`${text} · 落空`);audio(250,.06)}setTimeout(()=>$('#heroUnit').classList.remove(action),380);combatUpdate()}
function combatHit(damage,kind,text){const s=state;const critical=kind==='ultimate'||(kind==='basic'&&combatCombo===3);if(critical)damage=Math.round(damage*1.22);s.enemy-=damage;s.damage+=damage;s.enemyStun=kind==='launch'||kind==='ultimate'?1.05:.26;s.enemyX=Math.min(80,s.enemyX+(kind==='ultimate'?10:kind==='launch'?6:3));$('#monsterUnit').classList.remove('hurt');void $('#monsterUnit').offsetWidth;$('#monsterUnit').classList.add('hurt');$('#arena').classList.add('shake');setTimeout(()=>{$('#monsterUnit').classList.remove('hurt');$('#arena').classList.remove('shake')},350);combatFrozen=critical?.12:.055;const f=$('#combatFlash');f.classList.remove('flash');void f.offsetWidth;f.classList.add('flash');audio(critical?120:440,.1);notice(`${text}  ${critical?'暴击！ ':''}-${damage}`);if(s.enemy<=0)combatFinish(true,`${monsters[round]} 已被连招击败！`)}
function combatEnemyAttack(){const s=state;if(s.enemyStun>0||s.ended)return;$('#monsterUnit').classList.add('enemy-swing');setTimeout(()=>$('#monsterUnit').classList.remove('enemy-swing'),360);if(Math.abs(s.enemyX-s.heroX)<25&&combatJump<80){const damage=9+round*1.7;s.hp-=damage;s.stun=Math.random()<.32?.55:0;state.heroX=Math.max(1,state.heroX-5);$('#heroUnit').classList.add('hurt');setTimeout(()=>$('#heroUnit').classList.remove('hurt'),320);$('#arena').classList.add('shake');setTimeout(()=>$('#arena').classList.remove('shake'),240);audio(145,.12);notice(s.stun?'怪兽重拳 · 硬直！':`怪兽命中 -${Math.ceil(damage)}`);if(s.hp<=0)combatFinish(false,'英雄能量耗尽，城市失守')}else notice('怪兽攻击落空');s.enemyCd=1.3+Math.random()*1.1;combatUpdate()}
function combatFinish(win,detail){if(state.ended)return;state.ended=true;clearInterval(loopId);$('#resultKicker').textContent=win?'城市防卫成功':'战斗失败';$('#resultTitle').textContent=win?'连招胜利！':'能量耗尽';$('#resultDetail').textContent=detail;$('#statDamage').textContent=state.damage;$('#statHp').textContent=`${Math.max(0,Math.round(state.hp/state.maxHp*100))}%`;$('#statTime').textContent=`${Math.max(0,Math.ceil(state.time))}s`;$('#nextBtn').style.display=win&&round<19?'block':'none';show('result')}
battleStart=combatBattleStart;renderSkills=combatRenderSkills;move=combatMove;attack=combatAttack;tick=combatTick;enemyAttack=combatEnemyAttack;finish=combatFinish;update=combatUpdate;document.addEventListener('keydown',e=>{if(!state||!$('#battle').classList.contains('active'))return;const key=e.key.toLowerCase();if(['a','arrowleft'].includes(key)){e.preventDefault();combatMove(-1)}if(['d','arrowright'].includes(key)){e.preventDefault();combatMove(1)}if(['w','arrowup',' '].includes(key)){e.preventDefault();combatJumpStart()}if(key==='j')combatAttack('basic');if(key==='k')combatAttack('launch');if(key==='l')combatAttack('beam');if(key==='u')combatAttack('ultimate')});
</script></body></html>
